name: Checks and container
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:http
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:browser

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and smoke-test the runtime image
        run: |
          docker build -t shortener:ci .
          docker run -d --name shortener -p 127.0.0.1:3000:3000 shortener:ci
          trap 'docker logs shortener && docker rm -f shortener' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://localhost:3000/api/setup | jq -e '.isSetup == false'
      - name: Publish to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=(development)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[A-Za-z0-9_.-]{0,127}$ ]] || { echo "Git tag must be a valid container tag"; exit 1; }
            tags+=("$GITHUB_REF_NAME" latest)
          fi
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for tag in "${tags[@]}"; do docker tag shortener:ci "$image:$tag"; done
          docker push --all-tags "$image"
